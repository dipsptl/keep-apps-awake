name: Keep Apps Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl -L -c cookies.txt -b cookies.txt -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --max-time 60 https://thermolytix-gearbox-cooling-tower-ai-temperature-prediction.streamlit.app
      - name: Ping Hugging Face app
        run: curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" --max-time 30 https://huggingface.co/spaces/DipsPtl/EnginIQ
